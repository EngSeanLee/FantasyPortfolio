<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1672 941"
     width="1672" height="941"
     role="img"
     aria-labelledby="title desc"
     preserveAspectRatio="xMidYMid slice">

  <title id="title">Daylight Meadow living portfolio environment</title>
  <desc id="desc">
    Painterly daylight fantasy landscape with subtle moving clouds, foreground meadow wind,
    atmospheric particles, coasting birds, and water highlights.
  </desc>

  <defs>
    <!-- Keep the original painting as the visual source of truth. -->
    <image id="masterArt"
           href="/environment/daylight-meadow-master.png"
           x="0" y="0"
           width="1672" height="941"
           preserveAspectRatio="xMidYMid slice"/>

    <!-- Very subtle cloud distortion. -->
    <filter id="cloudDisplacement" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.006 0.012"
                    numOctaves="2"
                    seed="17"
                    result="cloudNoise">
        <animate attributeName="baseFrequency"
                 values="0.006 0.012;0.007 0.010;0.006 0.012"
                 dur="24s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic"
                         in2="cloudNoise"
                         scale="5"
                         xChannelSelector="R"
                         yChannelSelector="G">
        <animate attributeName="scale"
                 values="3;6;3"
                 dur="18s"
                 repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>

    <!-- Soft wind distortion used only on foreground vegetation. -->
    <filter id="meadowWind" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.003 0.028"
                    numOctaves="1"
                    seed="8"
                    result="windNoise">
        <animate attributeName="baseFrequency"
                 values="0.003 0.028;0.004 0.022;0.003 0.028"
                 dur="8s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic"
                         in2="windNoise"
                         scale="8"
                         xChannelSelector="R"
                         yChannelSelector="B">
        <animate attributeName="scale"
                 values="3;8;4;6;3"
                 dur="9s"
                 repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>

    <!-- Masks isolate only the regions intended to move. -->
    <linearGradient id="cloudMaskGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="52%" stop-color="white"/>
      <stop offset="72%" stop-color="black"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
    <mask id="cloudMask">
      <rect width="1672" height="941" fill="url(#cloudMaskGradient)"/>
    </mask>

    <linearGradient id="meadowMaskGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black"/>
      <stop offset="62%" stop-color="black"/>
      <stop offset="78%" stop-color="#777"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <mask id="meadowMask">
      <rect width="1672" height="941" fill="url(#meadowMaskGradient)"/>
    </mask>

    <!-- Water shimmer gradient. -->
    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0"/>
      <stop offset="44%" stop-color="#fff7d6" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#fff9e5" stop-opacity=".35"/>
      <stop offset="56%" stop-color="#fff7d6" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .bird {
        fill: none;
        stroke: #4f675d;
        stroke-width: 2.2;
        stroke-linecap: round;
        opacity: .58;
      }

      .mote {
        fill: #f5e6b8;
        opacity: 0;
        animation: moteRise 12s linear infinite;
      }

      .haze {
        animation: hazeDrift 44s ease-in-out infinite alternate;
      }

      @keyframes moteRise {
        0%   { transform: translateY(10px); opacity: 0; }
        16%  { opacity: .28; }
        78%  { opacity: .20; }
        100% { transform: translateY(-58px); opacity: 0; }
      }

      @keyframes hazeDrift {
        from { transform: translateX(-10px); opacity: .06; }
        to   { transform: translateX(20px); opacity: .12; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mote,
        .haze {
          animation: none !important;
        }
        #animatedClouds,
        #animatedMeadow,
        #birds,
        #waterShimmer {
          display: none;
        }
      }
    </style>
  </defs>

  <!-- 1. Original approved painting. -->
  <use href="#masterArt"/>

  <!-- 2. Duplicate only the cloud region and distort it slightly. -->
  <g id="animatedClouds"
     mask="url(#cloudMask)"
     opacity=".46"
     filter="url(#cloudDisplacement)">
    <use href="#masterArt">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-2 0;7 0;-2 0"
                        dur="38s"
                        repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 3. Duplicate only the foreground vegetation and give it very subtle wind. -->
  <g id="animatedMeadow"
     mask="url(#meadowMask)"
     opacity=".33"
     filter="url(#meadowWind)">
    <use href="#masterArt">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;2 -1;-1 0;0 0"
                        dur="11s"
                        repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 4. Atmospheric haze. -->
  <g id="atmosphere" class="haze" filter="url(#softBlur)">
    <ellipse cx="601" cy="432"
             rx="434" ry="32"
             fill="#fffdf4" opacity=".18"/>
    <ellipse cx="1120" cy="451"
             rx="334" ry="28"
             fill="#fffdf4" opacity=".12"/>
  </g>

  <!-- 5. Water shimmer in the lower valley. Kept extremely restrained. -->
  <g id="waterShimmer" opacity=".32">
    <rect x="50" y="498"
          width="1203" height="235"
          fill="url(#shimmerGrad)"
          transform="skewX(-8)">
      <animate attributeName="x"
               values="-585;1421"
               dur="18s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 6. Distant birds. -->
  <g id="birds">
    <g class="bird">
      <path d="M0 0 Q8 -6 16 0 Q24 -6 32 0"/>
      <animateMotion dur="27s"
                     repeatCount="indefinite"
                     path="M-90,150 C300,94 702,169 1070,112 C1337,75 1588,103 1792,65"/>
    </g>

    <g class="bird" opacity=".72">
      <path d="M0 0 Q6 -5 12 0 Q18 -5 24 0"/>
      <animateMotion dur="34s"
                     begin="-12s"
                     repeatCount="indefinite"
                     path="M-70,216 C334,178 568,112 953,159 C1237,197 1488,150 1772,122"/>
    </g>

    <g class="bird" opacity=".50">
      <path d="M0 0 Q5 -4 10 0 Q15 -4 20 0"/>
      <animateMotion dur="42s"
                     begin="-20s"
                     repeatCount="indefinite"
                     path="M-60,112 C250,159 518,84 785,122 C1120,169 1404,94 1752,112"/>
    </g>
  </g>

  <!-- 7. Sparse pollen / meadow motes. -->
  <g id="motes">
    <circle class="mote" cx="267" cy="715" r="1.8" style="animation-delay:-2s"/>
    <circle class="mote" cx="418" cy="677" r="1.5" style="animation-delay:-7s"/>
    <circle class="mote" cx="652" cy="743" r="1.7" style="animation-delay:-4s"/>
    <circle class="mote" cx="886" cy="686" r="1.4" style="animation-delay:-9s"/>
    <circle class="mote" cx="1136" cy="733" r="1.7" style="animation-delay:-5s"/>
    <circle class="mote" cx="1371" cy="668" r="1.5" style="animation-delay:-1s"/>
    <circle class="mote" cx="1504" cy="752" r="1.3" style="animation-delay:-8s"/>
  </g>
</svg>
